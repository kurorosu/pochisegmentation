[project]
name = "pochisegmentation"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
    "torchmetrics",
    # numpy 2.3 以降が Python 3.14 の公式 Windows wheel を提供する (2.2.x は sdist のみで segfault).
    "numpy>=2.3",
    "opencv-python",
    "matplotlib>=3.10.8",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
]

[project.scripts]
pochi = "pochisegmentation.cli.pochi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pydocstyle>=6.3.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.6.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# torchvision / segmentation_models_pytorch は py.typed 未提供だが実体はあるため,
# follow_untyped_imports で実装を辿りつつ import-untyped エラーを抑止する.
[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "segmentation_models_pytorch.*",
]
follow_untyped_imports = true

# colorlog はオプショナル依存 (try/except でガード) のため未導入環境では実体が無い.
# import-not-found を抑止する.
[[tool.mypy.overrides]]
module = ["colorlog"]
ignore_missing_imports = true

# tests は厳格な型注釈を要求しない.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -n auto --dist=worksteal"
markers = [
    "slow: 実行時間の長いテスト",
    "integration: 統合テスト",
    "unit: ユニットテスト",
]
